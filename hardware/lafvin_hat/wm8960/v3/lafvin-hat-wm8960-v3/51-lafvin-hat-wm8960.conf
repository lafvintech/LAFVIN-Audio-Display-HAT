# Managed by LAFVIN HAT WM8960 profile.
# Keep the calibrated hardware capture path owned by the device profile.
# WirePlumber may still apply software volume to its source node.
monitor.alsa.rules = [
  {
    matches = [
      # ALSA reports `wm8960soundcard` as the card ID and
      # `wm8960-soundcard` as the card name. The platform-derived
      # device.name is typically `alsa_card.platform-soc_sound`.
      { api.alsa.card.id = "wm8960soundcard" }
      { api.alsa.card.name = "wm8960-soundcard" }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  }
]
