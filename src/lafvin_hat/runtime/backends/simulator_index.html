<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LAFVIN HAT Simulator</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #10141d;
      color: #e6ebf2;
    }

    main {
      display: grid;
      gap: 20px;
      grid-template-columns: 286px 300px;
      align-items: start;
      padding: 20px;
    }

    .device,
    .panel {
      background: #1a2230;
      border: 1px solid #344158;
      border-radius: 18px;
      padding: 18px;
    }

    .display-shell {
      width: 248px;
      height: 288px;
      border: 4px solid #05070a;
      border-radius: 8px;
      overflow: hidden;
      background: #080b12;
    }

    #display {
      display: block;
      width: 240px;
      height: 280px;
      image-rendering: auto;
      background: #000;
    }

    .control-label {
      margin-top: 16px;
      color: #9cabc0;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .gesture-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 8px;
    }

    button {
      border: 0;
      border-radius: 10px;
      background: #3182f6;
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:active,
    button.pressed {
      background: #1759ad;
      transform: translateY(1px);
    }

    button:disabled {
      cursor: wait;
      opacity: .55;
    }

    .gesture-button {
      min-height: 42px;
      padding: 8px 5px;
      font-size: 12px;
    }

    #physical-button {
      width: 100%;
      min-height: 46px;
      margin-top: 10px;
      padding: 10px 14px;
      border-radius: 999px;
      background: #263247;
    }

    #physical-button:active,
    #physical-button.pressed {
      background: #40516f;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }

    .led {
      width: 18px;
      height: 18px;
      border: 1px solid #68758b;
      border-radius: 50%;
      background: rgb(0, 0, 0);
    }

    .display-state {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 14px 0;
    }

    .display-state div {
      padding: 8px;
      border-radius: 8px;
      background: #151e2c;
      color: #b9c5d8;
      font-size: 12px;
    }

    .display-state strong {
      display: block;
      margin-top: 3px;
      color: #f4f7fb;
      font-size: 14px;
    }

    label {
      display: grid;
      gap: 6px;
      margin: 14px 0;
    }

    input[type="range"] { width: 100%; }

    pre {
      max-height: 250px;
      margin: 14px 0 0;
      overflow: auto;
      white-space: pre-wrap;
      color: #b9c5d8;
      font-size: 11px;
    }

    #notice {
      min-height: 18px;
      margin-top: 8px;
      color: #ff9b9b;
      font-size: 12px;
    }

    @media (max-width: 650px) {
      main { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<main>
  <section class="device">
    <div class="display-shell">
      <canvas id="display" width="240" height="280" aria-label="240 by 280 device display"></canvas>
    </div>

    <div class="control-label">Gesture shortcuts</div>
    <div class="gesture-grid">
      <button class="gesture-button" data-clicks="1" type="button">Single Click</button>
      <button class="gesture-button" data-clicks="2" type="button">Double Click</button>
      <button class="gesture-button" data-clicks="3" type="button" title="Available outside Home">Triple Click</button>
    </div>
    <button id="physical-button" type="button">Press &amp; Hold (Raw Button)</button>
    <div id="notice" role="status"></div>
  </section>

  <section class="panel">
    <div class="row"><strong>Simulator Backend</strong><span class="led" id="led"></span></div>
    <div class="display-state">
      <div>UI mode<strong id="ui-mode">Loading</strong></div>
      <div>Frame sequence<strong id="frame-sequence">0</strong></div>
    </div>
    <label>Battery <span id="battery-value">100%</span><input id="battery" type="range" min="0" max="100" value="100"></label>
    <label><span><input id="charging" type="checkbox"> Charging</span></label>
    <label><span><input id="network" type="checkbox" checked> Network online</span></label>
    <pre id="state">Loading...</pre>
  </section>
</main>

<script>
const DISPLAY_WIDTH = 240;
const DISPLAY_HEIGHT = 280;
const FRAME_INTERVAL_MS = 1000 / 30;

const stateNode = document.querySelector("#state");
const displayNode = document.querySelector("#display");
const displayContext = displayNode.getContext("2d", {alpha: false});
const nativeFrameCanvas = document.createElement("canvas");
nativeFrameCanvas.width = DISPLAY_WIDTH;
nativeFrameCanvas.height = DISPLAY_HEIGHT;
const nativeFrameContext = nativeFrameCanvas.getContext("2d", {alpha: false});
const ledNode = document.querySelector("#led");
const batteryNode = document.querySelector("#battery");
const batteryValueNode = document.querySelector("#battery-value");
const chargingNode = document.querySelector("#charging");
const networkNode = document.querySelector("#network");
const uiModeNode = document.querySelector("#ui-mode");
const frameSequenceNode = document.querySelector("#frame-sequence");
const physicalButton = document.querySelector("#physical-button");
const gestureButtons = [...document.querySelectorAll(".gesture-button")];
const noticeNode = document.querySelector("#notice");

let uiMode = "declarative";
let latestFrameSequence = -1;
let renderedFrameSequence = -1;
let frameLoading = false;
let framePending = false;
let physicalPressed = false;

function paintDisplay() {
  const pixelRatio = Math.max(1, window.devicePixelRatio || 1);
  const targetWidth = Math.round(DISPLAY_WIDTH * pixelRatio);
  const targetHeight = Math.round(DISPLAY_HEIGHT * pixelRatio);
  if (displayNode.width !== targetWidth || displayNode.height !== targetHeight) {
    displayNode.width = targetWidth;
    displayNode.height = targetHeight;
  }
  displayContext.imageSmoothingEnabled = true;
  displayContext.imageSmoothingQuality = "high";
  displayContext.clearRect(0, 0, targetWidth, targetHeight);
  displayContext.drawImage(nativeFrameCanvas, 0, 0, targetWidth, targetHeight);
}

window.addEventListener("resize", paintDisplay);
paintDisplay();
let gestureBusy = false;
let tripleShortcutAvailable = false;

async function api(path, options) {
  const response = await fetch(path, options);
  if (!response.ok) throw new Error(await response.text());
  return response.json();
}

function renderState(state) {
  stateNode.textContent = JSON.stringify(state, null, 2);
  const {r, g, b} = state.led;
  ledNode.style.background = `rgb(${r},${g},${b})`;
  batteryNode.value = state.battery.level;
  batteryValueNode.textContent = `${state.battery.level}%`;
  chargingNode.checked = state.battery.charging;
  networkNode.checked = state.network.online;
  uiMode = state.ui.mode;
  latestFrameSequence = state.ui.frame_sequence;
  tripleShortcutAvailable = (
    uiMode === "raw_frame"
    || (state.ui.view && state.ui.view.kind !== "list")
  );
  updateGestureButtons();
  uiModeNode.textContent = uiMode;
  frameSequenceNode.textContent = String(latestFrameSequence);
  if (latestFrameSequence !== renderedFrameSequence) void renderFrame();
}

async function renderFrame() {
  if (frameLoading) {
    framePending = true;
    return;
  }
  frameLoading = true;
  const requestedSequence = latestFrameSequence;
  try {
    const response = await fetch("/api/frame", {cache: "no-store"});
    if (!response.ok) throw new Error(await response.text());
    const bytes = new Uint8Array(await response.arrayBuffer());
    const expected = DISPLAY_WIDTH * DISPLAY_HEIGHT * 2;
    if (bytes.length !== expected) {
      throw new Error(`Expected ${expected} frame bytes, received ${bytes.length}`);
    }
    const image = nativeFrameContext.createImageData(DISPLAY_WIDTH, DISPLAY_HEIGHT);
    for (let pixel = 0, offset = 0; pixel < DISPLAY_WIDTH * DISPLAY_HEIGHT; pixel++, offset += 2) {
      const value = (bytes[offset] << 8) | bytes[offset + 1];
      const target = pixel * 4;
      image.data[target] = ((value >> 11) & 0x1f) * 255 / 31;
      image.data[target + 1] = ((value >> 5) & 0x3f) * 255 / 63;
      image.data[target + 2] = (value & 0x1f) * 255 / 31;
      image.data[target + 3] = 255;
    }
    nativeFrameContext.putImageData(image, 0, 0);
    paintDisplay();
    renderedFrameSequence = requestedSequence;
    noticeNode.textContent = "";
  } catch (error) {
    noticeNode.textContent = String(error);
  } finally {
    frameLoading = false;
    if (framePending) {
      framePending = false;
      void renderFrame();
    }
  }
}

async function refresh() {
  try {
    renderState(await api("/api/state"));
  } catch (error) {
    noticeNode.textContent = String(error);
  }
}

async function updateState() {
  try {
    renderState(await api("/api/state", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        battery_level: Number(batteryNode.value),
        charging: chargingNode.checked,
        network_online: networkNode.checked
      })
    }));
  } catch (error) {
    noticeNode.textContent = String(error);
  }
}

async function setPhysicalButton(pressed) {
  if (pressed === physicalPressed) return;
  physicalPressed = pressed;
  physicalButton.classList.toggle("pressed", pressed);
  try {
    renderState(await api("/api/button", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({pressed})
    }));
  } catch (error) {
    noticeNode.textContent = String(error);
  }
}

function updateGestureButtons() {
  gestureButtons.forEach(button => {
    const isTriple = Number(button.dataset.clicks) === 3;
    button.disabled = gestureBusy || (isTriple && !tripleShortcutAvailable);
  });
}

async function triggerGesture(clicks) {
  gestureBusy = true;
  updateGestureButtons();
  try {
    renderState(await api("/api/gesture", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({clicks})
    }));
    window.setTimeout(refresh, 220);
  } catch (error) {
    noticeNode.textContent = String(error);
  } finally {
    gestureBusy = false;
    updateGestureButtons();
  }
}

gestureButtons.forEach(button => {
  button.addEventListener("click", () => void triggerGesture(Number(button.dataset.clicks)));
});

physicalButton.addEventListener("pointerdown", event => {
  event.preventDefault();
  physicalButton.setPointerCapture(event.pointerId);
  void setPhysicalButton(true);
});
for (const eventName of ["pointerup", "pointercancel"]) {
  physicalButton.addEventListener(eventName, () => void setPhysicalButton(false));
}

batteryNode.addEventListener("change", updateState);
chargingNode.addEventListener("change", updateState);
networkNode.addEventListener("change", updateState);

void refresh();
window.setInterval(refresh, 1000);
window.setInterval(() => {
  if (uiMode === "raw_frame") void renderFrame();
}, FRAME_INTERVAL_MS);
</script>
</body>
</html>
