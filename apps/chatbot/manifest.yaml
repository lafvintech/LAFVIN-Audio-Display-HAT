schema_version: 1
id: dev.lafvin.chatbot
name: AI Chatbot
version: 0.1.0
description: Streaming voice chatbot using independent ASR, LLM, and TTS providers

entrypoint:
  executable: python
  args:
    - main.py
  working_directory: .

permissions:
  - display.raw_frame
  - button
  - microphone
  - speaker
  - network
  - ai

ui:
  mode: raw_frame

lifecycle:
  startup_timeout_sec: 10
  exit_timeout_sec: 5
  restart: never
  max_restarts: 0
