schema_version: 1
id: dev.lafvin.system-volume
name: Volume
version: 0.1.0
description: Runtime audio volume control

entrypoint:
  executable: python
  args:
    - main.py
  working_directory: .

permissions:
  - display.raw_frame
  - button
  - speaker

ui:
  mode: raw_frame

lifecycle:
  startup_timeout_sec: 10
  exit_timeout_sec: 3
  restart: never
  max_restarts: 0
