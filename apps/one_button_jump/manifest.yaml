schema_version: 1
id: dev.lafvin.jump
name: One Button Jump
version: 0.2.0
description: Single-button endless runner with randomized obstacles and progressive speed

entrypoint:
  executable: python
  args:
    - main.py
  working_directory: .

permissions:
  - display.raw_frame
  - button

ui:
  mode: raw_frame

lifecycle:
  startup_timeout_sec: 10
  exit_timeout_sec: 3
  restart: never
  max_restarts: 0
