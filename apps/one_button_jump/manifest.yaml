schema_version: 1
id: dev.lafvin.jump
name: Dino Runner
version: 0.3.1
description: Toolkit-rendered pixel dinosaur runner with immediate single-button jumping

entrypoint:
  executable: python
  args:
    - main.py
  working_directory: .

permissions:
  - display.raw_frame
  - button

ui:
  mode: raw_frame

lifecycle:
  startup_timeout_sec: 10
  exit_timeout_sec: 3
  restart: never
  max_restarts: 0
