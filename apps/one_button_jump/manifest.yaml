schema_version: 1
id: dev.lafvin.jump
name: One Button Jump
version: 0.1.0
description: M3 Raw Frame and input latency demonstration

entrypoint:
  executable: python
  args:
    - main.py
  working_directory: .

permissions:
  - display.raw_frame
  - button

ui:
  mode: raw_frame

lifecycle:
  startup_timeout_sec: 10
  exit_timeout_sec: 3
  restart: never
  max_restarts: 0
