schema_version: 1
id: dev.lafvin.video-player
name: Video Player
version: 0.2.2
description: Selectable local video playback with single-button navigation

entrypoint:
  executable: python
  args:
    - main.py
  working_directory: .

permissions:
  - display.raw_frame
  - button

ui:
  mode: raw_frame

lifecycle:
  startup_timeout_sec: 10
  exit_timeout_sec: 3
  restart: never
  max_restarts: 0
