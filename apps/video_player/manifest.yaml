schema_version: 1
id: dev.lafvin.video-player
name: Video Player
version: 0.1.0
description: V2-M5 standalone MP4 and local video playback trial

entrypoint:
  executable: python
  args:
    - main.py
  working_directory: .

permissions:
  - display.raw_frame
  - button

ui:
  mode: raw_frame

lifecycle:
  startup_timeout_sec: 10
  exit_timeout_sec: 3
  restart: never
  max_restarts: 0
